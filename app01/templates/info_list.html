<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MTitle</title>
</head>

<body>

<h1>INFO list</h1>

<a href="/info/add/">Add User</a>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Password</th>
            <th>Age</th>
        </tr>
    </thead>
    <tbody>
    {% for data in data_list %}
        <tr>
            <td>{{ forloop.counter }}</td>  {# 1, 2, 3, … #}
            <td>{{ data.name }}</td>
            <td>{{ data.password }}</td>
            <td>{{ data.age }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>

</body>
</html>
